# The ephemeral journey stack: one per `make journeys` run, started by scripts/test_stack_up.sh
# under its own Compose project name and removed by scripts/test_stack_down.sh.
#
# Real systems only: the pinned Paperclip image with its own database, a Postgres for
# Mandate's own tables and for Temporal, and Temporal. Host ports are never fixed: each
# service publishes on 127.0.0.1 with a port Docker picks per run, so two runs can share
# a machine and share nothing. Passwords and signing secrets come from the environment of
# the run and are never written to the repo.
services:
  paperclip-db:
    image: postgres:16
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${STACK_DB_PASSWORD:?set by test_stack_up.sh}
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mandate
      POSTGRES_PASSWORD: ${STACK_DB_PASSWORD:?set by test_stack_up.sh}
      POSTGRES_DB: mandate
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate -d mandate"]
      interval: 2s
      timeout: 5s
      retries: 30

  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: mandate
      POSTGRES_PWD: ${STACK_DB_PASSWORD:?set by test_stack_up.sh}
      POSTGRES_SEEDS: postgres
    ports:
      - "127.0.0.1::7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  paperclip:
    # The baseline build the journeys are written against (ER-09: never a floating tag).
    image: drivestream-lab/paperclip:mandate-baseline-a665ed6
    pull_policy: never
    depends_on:
      paperclip-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://paperclip:${STACK_DB_PASSWORD:?set by test_stack_up.sh}@paperclip-db:5432/paperclip
      BETTER_AUTH_SECRET: ${STACK_AUTH_SECRET:?set by test_stack_up.sh}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${STACK_SIGNING_SECRET:?set by test_stack_up.sh}
    ports:
      - "127.0.0.1::3100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 20s
