# make deploy: the branch built from the Dockerfile and run with its .env, on its own
# Postgres and Redis. Used locally and by mandate-runner on every PR (inside its sandbox).
# After a merge into develop the runner deploys to the lab stack itself and does not use
# this file.
#
# The project name is set by make (DEPLOY_PROJECT), so branches can run side by side.
# Settings come from .env.example, then .env when present; the database and Redis hosts
# are this stack's own services.
name: mandate-deploy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: deploy-superuser-throwaway
      POSTGRES_DB: ds_mandate_db
      # Throwaway deploy-stack passwords for the two roles the lab also has; the init script
      # below creates them, the migration only grants to them. The three passwords differ, so
      # the service's own password logs in as mandate_app and nothing else.
      MANDATE_DB_OWNER_PASSWORD: deploy-owner-throwaway
      MANDATE_DB_APP_PASSWORD: deploy-app-throwaway
    volumes:
      - ./postgres/10-mandate-roles.sh:/docker-entrypoint-initdb.d/10-mandate-roles.sh:ro
    # Published on a free loopback port so a journey can connect as each role:
    # docker compose -p <project> port postgres 5432
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ds_mandate_db"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Puts the two throwaway password files (docker/deploy-secrets/) into a volume with the
  # modes the lab files have: the owner's root-only (0600), the app's world-readable. A bind
  # mount would keep the checkout's own modes, which the repo cannot fix.
  database-secrets:
    image: postgres:16
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - install -m 644 /in/app-password /out/app-password && install -m 600 /in/owner-password /out/owner-password
    volumes:
      - ./deploy-secrets:/in:ro
      - database-secrets:/out

  # Receives the service's OTLP traces and metrics and writes them to its own logs (debug
  # exporter) until a real backend exists. The image has no shell, so no healthcheck; the
  # service starts without it and warns once when it cannot reach it.
  otel-collector:
    image: otel/opentelemetry-collector:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro

  mandate:
    build:
      context: ..
      dockerfile: Dockerfile
      # In the runner's sandbox the only way out is its egress proxy; elsewhere these are empty.
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    env_file:
      - path: ../.env.example
      - path: ../.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # The app's set is the service's connection; the owner's runs the migrations only.
      POSTGRES_USER: mandate_app
      POSTGRES_PASSWORD_FILE: /run/mandate/app-password
      POSTGRES_MIGRATION_USER: mandate_owner
      POSTGRES_MIGRATION_PASSWORD_FILE: /run/mandate/owner-password
      POSTGRES_DB: ds_mandate_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_PORT: "8000"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # The image holds no test files; the deploy stack mounts the public test key.
      JWT_PUBLIC_KEY_PATH: /app/config/jwt_public.pem
    volumes:
      - ../tests/fixtures/jwt_public.pem:/app/config/jwt_public.pem:ro
      - database-secrets:/run/mandate:ro
    # Starts as root so the entrypoint can read the owner's file for the migration, then runs
    # the service as the app user, which cannot read it.
    user: "0:0"
    ports:
      - "127.0.0.1:${MANDATE_DEPLOY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      database-secrets:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  database-secrets:
