# make deploy: the branch built from the Dockerfile and run with its .env, on its own
# Postgres and Redis. Used locally and by mandate-runner on every PR (inside its sandbox).
# After a merge into develop the runner deploys to the lab stack itself and does not use
# this file.
#
# The project name is set by make (DEPLOY_PROJECT), so branches can run side by side.
# Settings come from .env.example, then .env when present; the database and Redis hosts
# are this stack's own services.
name: mandate-deploy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: deploy-superuser-throwaway
      POSTGRES_DB: ds_mandate_db
      # Throwaway deploy-stack passwords for the two roles the lab also has; the init script
      # below creates them, the migration only grants to them. The three passwords differ, so
      # the service's own password logs in as mandate_app and nothing else.
      MANDATE_DB_OWNER_PASSWORD: deploy-owner-throwaway
      MANDATE_DB_APP_PASSWORD: deploy-app-throwaway
    volumes:
      - ./postgres/10-mandate-roles.sh:/docker-entrypoint-initdb.d/10-mandate-roles.sh:ro
    # Published on a free loopback port so a journey can connect as each role:
    # docker compose -p <project> port postgres 5432
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ds_mandate_db"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  mandate:
    build:
      context: ..
      dockerfile: Dockerfile
      # In the runner's sandbox the only way out is its egress proxy; elsewhere these are empty.
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    env_file:
      - path: ../.env.example
      - path: ../.env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      # The app's set is the service's connection; the owner's runs the migrations only.
      POSTGRES_USER: mandate_app
      POSTGRES_PASSWORD: deploy-app-throwaway
      POSTGRES_MIGRATION_USER: mandate_owner
      POSTGRES_MIGRATION_PASSWORD: deploy-owner-throwaway
      POSTGRES_DB: ds_mandate_db
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_PORT: "8000"
      # The image holds no test files; the deploy stack mounts the public test key.
      JWT_PUBLIC_KEY_PATH: /app/config/jwt_public.pem
    volumes:
      - ../tests/fixtures/jwt_public.pem:/app/config/jwt_public.pem:ro
    ports:
      - "127.0.0.1:${MANDATE_DEPLOY_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 3s
      timeout: 5s
      retries: 40
