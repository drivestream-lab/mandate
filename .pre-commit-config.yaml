# pre-commit runs make check (Black, Ruff, pyright strict, import-linter); pre-push runs
# make test. Both call the project's own .venv through the Makefile.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: make-check
        name: make check
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: make-test
        name: make test
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
